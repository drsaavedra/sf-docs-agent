name: Release steps
description: Decide, test, publish, tag and check one version; `dry` runs every step with `npm publish --dry-run`.
inputs:
  dry:
    description: "'true' for a dry run: no publish, no tag; checks the version already on npm"
    required: true
  gh-token:
    description: Token for the tag and GitHub Release (unused in a dry run)
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        cache: npm

    # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers). One pinned npm for every step.
    - shell: bash
      run: npm install -g npm@11.19.0 && npm --version

    - name: Decide what to publish
      id: v
      shell: bash
      env:
        DRY: ${{ inputs.dry }}
      run: |
        v=$(node -p "require('./package.json').version")
        latest=$(npm view sf-docs-agent version)
        echo "package.json $v, npm latest $latest, dry run $DRY"
        # Plain x.y.z only: a prerelease would publish as npm's latest, and the comparison below cannot order one.
        [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$v is not a plain x.y.z version"; exit 1; }
        if [ "$DRY" = true ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; echo "check=$latest" >> "$GITHUB_OUTPUT"; exit 0; fi
        # Only E404 means "not on npm"; any other failure (network, registry) stops the run rather than publishing.
        if out=$(npm view "sf-docs-agent@$v" version 2>&1); then on_npm=true
        elif grep -q E404 <<< "$out"; then on_npm=false
        else echo "::error::npm view failed: $out"; exit 1; fi
        # Already on npm: a rerun of this commit's release skips the publish but still tags and checks; a tag on another
        # commit means an earlier release (a package.json change with no bump), so there is nothing to do.
        if [ "$on_npm" = true ]; then
          tagged=$(git ls-remote origin "refs/tags/v$v" "refs/tags/v$v^{}" | tail -1 | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "$v was released from $tagged: nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$v is already on npm: tag and check only"; echo "publish=false" >> "$GITHUB_OUTPUT"; echo "check=$v" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # A lower version would become npm's latest, so refuse anything not above it.
        node -e 'const [a,b]=process.argv.slice(1).map(s=>s.split(".").map(Number));process.exit(((a[0]-b[0])||(a[1]-b[1])||(a[2]-b[2]))>0?0:1)' "$v" "$latest" \
          || { echo "::error::$v is not above npm latest $latest"; exit 1; }
        echo "publish=true" >> "$GITHUB_OUTPUT"; echo "check=$v" >> "$GITHUB_OUTPUT"

    - if: steps.v.outputs.skip != 'true'
      shell: bash
      run: npm ci && npm test

    # Install this commit's tarball the way a user would, before anything is published.
    - if: steps.v.outputs.skip != 'true'
      name: Pack and install this commit
      id: pack
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/pkg"
        info=$(npm pack --pack-destination "$RUNNER_TEMP/pkg" --json)
        tgz="$RUNNER_TEMP/pkg/$(node -p "JSON.parse(process.argv[1])[0].filename" "$info")"
        echo "shasum=$(node -p "JSON.parse(process.argv[1])[0].shasum" "$info")" >> "$GITHUB_OUTPUT"
        cfg="$RUNNER_TEMP/cfg"
        # Outside the checkout: inside it, npx resolves sf-docs-agent to this package and finds no command.
        (cd "$RUNNER_TEMP" && CLAUDE_CONFIG_DIR="$cfg" npx --yes --package="$tgz" sf-docs-agent < /dev/null)
        agent="$cfg/agents/sf-docs.md"
        grep -c "$cfg/sf-docs/fetch-docs.mjs" "$agent"
        if grep -q '/path/to/sf-docs-agent' "$agent"; then echo "::error::placeholder path left in the agent"; exit 1; fi
        node -e "require('assert').ok(require('fs').statSync('$cfg/sf-docs/node_modules/playwright-core/package.json'))"
        echo "installed $tgz: agent wired, playwright-core present"

    # Provenance comes with trusted publishing, so there is no --provenance flag.
    - if: steps.v.outputs.publish == 'true'
      name: Publish
      shell: bash
      env:
        DRY: ${{ inputs.dry }}
      run: |
        if [ "$DRY" = true ]; then
          # A dry run still refuses a version already on npm, so stamp a throwaway prerelease in this copy only.
          npm version --no-git-tag-version "${{ steps.v.outputs.check }}-dryrun.$GITHUB_RUN_ID"
          npm publish --dry-run --tag dryrun
        else
          npm publish
        fi

    # Before the tag: npm must hold the tarball installed and checked above, or the tag would name the wrong commit.
    - if: inputs.dry != 'true' && steps.v.outputs.skip != 'true'
      name: Check the registry copy
      shell: bash
      run: |
        v=${{ steps.v.outputs.check }}
        for i in 1 2 3 4 5 6; do npm view "sf-docs-agent@$v" dist.shasum >/dev/null 2>&1 && break; sleep 20; done
        remote=$(npm view "sf-docs-agent@$v" dist.shasum)
        tested=${{ steps.pack.outputs.shasum }}
        echo "registry $remote, tested $tested"
        [ "$remote" = "$tested" ] || { echo "::error::the registry tarball is not the one this run tested"; exit 1; }

    - if: inputs.dry != 'true' && steps.v.outputs.skip != 'true'
      name: Tag and GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        t="v${{ steps.v.outputs.check }}"
        # Only "release not found" means create it; an auth or API error stops the run.
        if out=$(gh release view "$t" 2>&1); then echo "$t already released"; exit 0; fi
        grep -q 'release not found' <<< "$out" || { echo "::error::gh release view failed: $out"; exit 1; }
        gh release create "$t" --target "$GITHUB_SHA" --title "$t" --generate-notes
